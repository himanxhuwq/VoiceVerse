<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceVerse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='%23FF5A36'><rect x='0' y='8.5' width='4' height='11' rx='2'/><rect x='6' y='3.0' width='4' height='22' rx='2'/><rect x='12' y='6.5' width='4' height='15' rx='2'/><rect x='18' y='1.0' width='4' height='26' rx='2'/><rect x='24' y='9.5' width='4' height='9' rx='2'/></svg>">
<meta name="description" content="Turn any written story into a cinematic audio experience: narrator, character voices, music and sound effects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* VoiceVerse design tokens
   Type: Big Shoulders Display (display caps) · Schibsted Grotesk (UI) · IBM Plex Mono (labels, time)
   Scale: major third 1.25 on 16 → 12.8 · 16 · 20 · 25 · 31.25 · 39 · 48.8 · 61 · 76.3
   Space: 4pt → 4 8 12 16 24 32 48 64 · Radius: 12 panels, 8 controls, pill chips
   Contrast on --bg: --tx 17.1:1 · --mu 7.9:1 · --acc 6.6:1 · ink on --acc 6.6:1 */
:root{
  --bg:#0D0F14; --s1:#151821; --s2:#1C2029; --s3:#262B37; --line:#2B303C; --line2:#3A404E;
  --tx:#F3EFE6; --mu:#A3A9B6; --acc:#FF5A36; --acc-ink:#1A0A05; --acc-t:rgba(255,90,54,.14);
  --nar:#E9E3D6; --dia:#FF5A36; --mus:#6FC3B2; --sfx:#F4C04E; --bad:#FF7A7A;
  --f-d:'Big Shoulders Display',sans-serif; --f-b:'Schibsted Grotesk',system-ui,sans-serif; --f-m:'IBM Plex Mono',ui-monospace,monospace;
  --t1:12.8px; --t2:16px; --t3:20px; --t4:25px; --t5:31.25px; --t6:39px; --t7:48.8px; --t8:61px; --t9:76.3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--f-b);font-size:var(--t2);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.mono{font-family:var(--f-m)}
.cap{font:500 var(--t1)/1.2 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.disp{font-family:var(--f-d);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:.005em}
.hint{font-size:13px;color:var(--mu)}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:8px;font-weight:600;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-p{background:var(--acc);color:var(--acc-ink)}
.btn-s{background:var(--s2);border:1px solid var(--line2)}
.btn-g{color:var(--mu)} .btn-g:hover{color:var(--tx)}
.btn-l{height:56px;padding:0 32px;font-size:var(--t3)}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
button.chip{cursor:pointer} button.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 var(--t3)/1 var(--f-d);color:var(--acc-ink);flex:none;text-transform:uppercase}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main>*{animation:fadein .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{height:72px;flex:none;display:flex;align-items:center;padding:0 32px;border-bottom:1px solid var(--line);gap:24px;position:sticky;top:0;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);z-index:20}
.logo{display:flex;align-items:center;gap:10px;font:900 var(--t4)/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;cursor:pointer}
.mk{display:flex;gap:2px;align-items:center;height:24px}
.mk i{display:block;width:4px;border-radius:2px;background:var(--acc)}
.steps{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.steps button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mu);white-space:nowrap}
.steps button b{font:600 12px var(--f-m);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
.steps button.done b{background:var(--s3);border-color:var(--s3);color:var(--tx)}
.steps button.on{background:var(--s2);color:var(--tx)}
.steps button.on b{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.mode{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;white-space:nowrap}
.mode .dot{background:var(--sfx)} .mode.live .dot{background:var(--mus)}

#main{flex:1;display:flex;flex-direction:column;width:100%;max-width:1440px;margin:0 auto}
.wrap{padding:32px 48px 48px;display:flex;flex-direction:column;gap:24px;flex:1}
.h1{font-size:var(--t8)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head .acts{display:flex;gap:12px;flex-wrap:wrap}

/* home */
.hero{flex:1;display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:64px;padding:48px 48px 0 96px;align-items:center}
.hero h1{font-size:clamp(56px,7vw,95px);margin:24px 0}
.hero h1 em{font-style:normal;color:var(--acc)}
.lede{font-size:var(--t3);color:var(--mu);max-width:32ch;line-height:1.45}
.ctas{display:flex;gap:16px;margin-top:40px;align-items:center;flex-wrap:wrap}
.onair{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f-m);letter-spacing:.1em;color:var(--acc);border:1px solid rgba(255,90,54,.4);padding:6px 12px;border-radius:999px}
.onair .dot{background:var(--acc);box-shadow:0 0 0 4px rgba(255,90,54,.18)}
.onair.live .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,90,54,.05)}}
.stage{position:relative;height:560px}
.page{position:absolute;left:0;top:16px;width:380px;background:var(--nar);color:#1B1A17;border-radius:12px;padding:32px;transform:rotate(-3deg);box-shadow:0 32px 64px rgba(0,0,0,.5)}
.page .cap{color:#5E5A52}
.page h4{font:800 var(--t5)/1 var(--f-d);text-transform:uppercase;margin:12px 0 16px}
.page p{font-size:15px;line-height:1.65;margin-bottom:12px}
.page mark{background:none;padding:0 2px;border-bottom:3px solid}
.mixer{position:absolute;right:0;bottom:24px;width:min(460px,100%);padding:24px;border-radius:12px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 32px 64px rgba(0,0,0,.55)}
.lane{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;height:40px}
.lane .ln{font:500 12px var(--f-m);letter-spacing:.06em;color:var(--mu);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.lane .tr{position:relative;height:28px;border-radius:6px;background:var(--s2)}
.lane .blk{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;padding:0 4px}
.mwave{display:flex;align-items:center;gap:2px;height:100%}
.mwave i{display:block;flex:1;border-radius:2px;background:rgba(13,15,20,.45)}
.howrow{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 48px 0 96px;border-top:1px solid var(--line);padding:24px 0 32px}
.howrow div{display:flex;gap:12px;align-items:baseline;padding-right:24px}
.howrow b{font:600 13px var(--f-m);color:var(--acc)}
.howrow span{font-weight:600}
.howrow small{display:block;color:var(--mu);font-size:14px;font-weight:400}

/* story */
.split{display:grid;grid-template-columns:1fr 380px;gap:32px;flex:1}
.tabs{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{display:flex;gap:8px;align-items:center;height:40px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:500;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--s3);color:var(--tx)}
.editor{display:flex;flex-direction:column;min-height:480px}
.editor textarea{flex:1;width:100%;resize:none;background:transparent;border:0;padding:28px 36px;font-size:17px;line-height:1.75;outline:none;min-height:360px}
.editor textarea::placeholder{color:#6E7482}
.editor .ft{display:flex;align-items:center;gap:16px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.meter{width:160px;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mus);border-radius:3px;transition:width .2s}
.meter.warn i{background:var(--sfx)} .meter.bad i{background:var(--bad)}
.drop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:2px dashed var(--line2);border-radius:12px;margin:24px;padding:48px;text-align:center;color:var(--mu)}
.drop.over{border-color:var(--acc);background:var(--acc-t)}
.drop .ph{font-size:48px;color:var(--tx)}
.side{display:flex;flex-direction:column;gap:16px}
.side .panel{padding:24px}
.field{margin-bottom:20px} .field:last-child{margin-bottom:0}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.inp{width:100%;height:48px;padding:0 16px;border-radius:8px;background:var(--s2);border:1px solid var(--line2);font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 16px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--mu);padding:6px 0}
.check .ph-fill{color:var(--mus)}
.err{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:8px;background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.35);color:#FFD2D2;font-size:14px}
.err .ph{color:var(--bad);font-size:18px;margin-top:1px}
.note{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:8px;background:rgba(244,192,78,.08);border:1px solid rgba(244,192,78,.3);font-size:14px;color:#F4E3B8}
.note .ph{color:var(--sfx);font-size:18px;margin-top:1px}

/* analysis */
.facts{display:grid;grid-template-columns:180px 180px 1fr 260px;gap:16px}
.fact{padding:20px 24px}
.fact .v{font:800 var(--t6)/1 var(--f-d);text-transform:uppercase;margin-top:12px}
.arc{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.arc .ph{color:var(--mu);font-size:14px}
.ancols{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scene{padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.scene .sr{display:flex;justify-content:space-between;align-items:center}
.scene h4{font:800 var(--t4)/1 var(--f-d);text-transform:uppercase}
.scene p{font-size:14px;color:var(--mu);line-height:1.55}
.cues{display:flex;gap:8px;flex-wrap:wrap}
.cast{padding:24px}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.person input{background:transparent;border:0;border-bottom:1px dashed transparent;font-weight:600;font-size:16px;width:100%;outline:none;padding:2px 0}
.person input:hover,.person input:focus{border-bottom-color:var(--line2)}
.person small{color:var(--mu);font-size:13px;display:block}
.person .n{font:500 13px var(--f-m);color:var(--mu);text-align:right}
.mood-tense{border-color:var(--acc)!important;color:var(--acc)}

/* voices */
.vs{display:grid;grid-template-columns:320px 1fr;flex:1}
.castlist{border-right:1px solid var(--line);padding:32px 24px;display:flex;flex-direction:column;gap:8px}
.ci{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid transparent;text-align:left;width:100%}
.ci:hover{background:var(--s1)}
.ci.on{background:var(--s1);border-color:var(--line2)}
.ci b{display:block;font-size:15px}.ci small{color:var(--mu);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.vmain{padding:32px 48px;display:flex;flex-direction:column;gap:24px;min-width:0}
.who{display:flex;gap:20px;align-items:center}
.who .av{width:72px;height:72px;font-size:var(--t6)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.voice{padding:14px 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;text-align:left;width:100%}
.voice:hover{border-color:var(--line2)}
.voice.on{border-color:var(--acc);background:linear-gradient(var(--acc-t),var(--acc-t)),var(--s1)}
.voice b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice small{font-size:13px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-size:16px;flex:none}
.voice.on .play{background:var(--acc);color:var(--acc-ink)}
.ctrls{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:16px}
.ctrl{padding:20px 24px}
.ctrl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.ctrl .row b{font-size:15px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:10px;font-family:var(--f-m)}
.emo{display:flex;flex-wrap:wrap;gap:8px}
.emo .chip{height:32px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--s3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--tx);margin-top:-7px;box-shadow:0 0 0 4px var(--bg)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--s3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--tx);border:0}
.preview{display:flex;align-items:center;gap:20px;padding:20px 24px}
.preview .play{width:52px;height:52px;background:var(--acc);color:var(--acc-ink);font-size:20px}
.preview q{font-size:var(--t3);font-weight:500;flex:1;display:block;margin-top:6px}

/* build */
.gen-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:64px;padding:48px 96px;align-items:center}
.ring{position:relative;width:min(400px,80vw);aspect-ratio:1;margin:auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{transition:stroke-dashoffset .3s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c .disp{font-size:var(--t9)}
.pstep{display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.pstep:last-child{border-bottom:1px solid var(--line)}
.pstep .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--s2);color:var(--mu)}
.pstep.done .ic{background:rgba(111,195,178,.16);color:var(--mus)}
.pstep.now .ic{background:var(--acc);color:var(--acc-ink)}
.pstep.fail .ic{background:rgba(255,122,122,.18);color:var(--bad)}
.pstep small{display:block;color:var(--mu);font-size:13px}
.pstep .st{font:500 13px var(--f-m);color:var(--mu)}
.pstep.now .st{color:var(--acc)} .pstep.fail .st{color:var(--bad)}
.pstep.wait{opacity:.55}

/* timeline */
.legend{display:flex;gap:20px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.legend span{display:flex;gap:8px;align-items:center}
.board{display:grid;grid-template-columns:120px 1fr;border-radius:12px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.lanes-l{border-right:1px solid var(--line);display:grid;grid-template-rows:56px repeat(4,112px)}
.lanes-l div{display:flex;align-items:center;gap:8px;padding:0 12px;font:500 12px var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);border-top:1px solid var(--line)}
.lanes-l div:first-child{border:0}
.scroller{overflow-x:auto;position:relative}
.grid{position:relative;display:grid;grid-template-rows:56px repeat(4,112px);min-width:100%}
.ruler{position:relative}
.ruler div{position:absolute;top:0;bottom:0;padding:10px 12px;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap;cursor:pointer}
.ruler b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ruler .mono{font-size:12px;color:var(--mu)}
.trk{position:relative;border-top:1px solid var(--line)}
.sep{position:absolute;top:56px;bottom:0;width:1px;background:var(--line)}
.b{position:absolute;top:14px;bottom:14px;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;overflow:hidden;color:#111;z-index:1;text-align:left;min-width:6px}
.b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.b .wv{position:absolute;left:6px;right:6px;bottom:6px;height:22px;display:flex;align-items:center;gap:2px}
.b .wv i{flex:1;background:rgba(13,15,20,.28);border-radius:1px}
.b.nar{background:var(--nar)} .b.dia{background:var(--dia)} .b.mus{background:var(--mus)} .b.sfx{background:var(--sfx);padding:6px 8px}
.b.sfx.r0{top:10px;bottom:58px} .b.sfx.r1{top:58px;bottom:10px}
.b.sel{outline:2px solid var(--tx);outline-offset:2px;z-index:2}
.b.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);z-index:3;pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:var(--tx);border-radius:3px 3px 50% 50%}
.inspector{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:16px 24px}
.sw{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#111}
.inspector .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.inspector .tx{font-size:14px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* player */
.player{flex:1;display:grid;grid-template-columns:1fr 380px}
.pmain{padding:48px 64px 40px;display:flex;flex-direction:column;position:relative;min-width:0;overflow:hidden}
.glow{position:absolute;left:-200px;top:-260px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(255,90,54,.13),transparent);pointer-events:none}
.ptitle{font-size:clamp(48px,6vw,92px);margin:16px 0 8px}
.nowp{display:flex;gap:12px;align-items:center;color:var(--mu);flex-wrap:wrap}
.lyric{margin:40px 0 32px;display:flex;flex-direction:column;gap:14px;max-width:860px;min-height:220px;justify-content:flex-end}

<script>
/* =========================================================
   VoiceVerse: working front-end
   - Story reader: Gemini (with key) or the built-in reader
   - Voices: ElevenLabs (with key) or the browser's own voices
   - Music + sound effects: synthesised live with Web Audio
   - Mix: rendered offline into one track (WAV / MP3)
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtT=x=>{x=Math.max(0,x||0);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0')};
const words=t=>(t.trim().match(/\S+/g)||[]).length;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}

/* ---------- sample stories (demo content) ---------- */
const SAMPLES=[
{title:'The Lantern Keeper',text:`The wind came off the sea long before the thunder did. Mira climbed the last stair of the lighthouse, the lantern swinging in her hand, and set it down beside the great dark lens.

"Keep it lit, whatever comes," old Tomas had told her that morning, coughing into his sleeve. "Ships are counting on it. So am I."

By dusk the sky had turned the colour of a bruise. Rain hammered the glass. Below, the waves rose black and white against the rocks, and the door at the foot of the tower banged open, then shut, then open again.

"Not tonight," Mira whispered, turning the wick up high. "You won't put it out tonight."

Then, somewhere inside the storm, a voice that was not the wind began to sing. It was low and strange and very old, and the lantern flame bent towards it like a flower towards the sun.

"Little keeper," sang the Storm Spirit, "why do you guard a fire that is not yours? Let it sleep. Come down to the water."

Mira's hands shook, but she did not let go. "It is mine," she said. "Tomas gave it to me. And there are people out there who need to find the shore."

The Storm Spirit laughed, and the thunder laughed with it. Lightning cracked across the sky. For a long moment the whole tower trembled, and the flame shrank to a single blue spark.

Mira cupped it in her hands and breathed on it, softly, the way Tomas had shown her. The spark caught. The flame grew. The great lens turned, and its beam swept out across the angry sea.

Far away, a ship's horn answered.

By morning the storm had gone. Gulls wheeled over the bright, calm water, and Tomas came slowly up the stairs, smiling.

"You kept it lit," he said.

"I kept it lit," said Mira.`},
{title:'The Clockwork Fox',text:`In the market town of Brill, where every chimney smoked and every bell had a name, there lived a clockmaker called Ada and a fox made of brass.

The fox ticked when it walked. Tick, tick, tick, across the workshop floor, between the cogs and the candle stubs.

"You're late again," Ada said, not looking up from her bench.

"The bells were ringing," said the fox. "I stopped to count them. There were nine, but the tower only has eight."

Ada put down her tiny screwdriver. She knew every bell in Brill. The ninth one was not supposed to exist.

That night they crept out together through the crowd of the late market, past the fire-eaters and the cheering children, to the foot of the old clock tower. The door was locked, but the fox slipped its brass tail into the keyhole and turned it with a click.

Inside, the stairs went up and up. At the very top, hanging in the dark, was a small silver bell that glowed like the moon.

"Who made you?" Ada whispered.

The bell rang once, softly, and a voice like falling snow answered. "Someone who wanted to be remembered. Will you remember me?"

The fox looked at Ada. Ada looked at the fox.

"We will," said Ada. "Every hour."

And from that night on, the clock tower of Brill rang nine times at nine o'clock, and everyone in town was sure it always had.`}];

/* ---------- state ---------- */
const MOODS=['calm','tense','mysterious','hopeful','sad','happy','epic'];
const SFX_TYPES={rain:'Rain',thunder:'Thunder',wind:'Wind',door:'Door',knock:'Knock',steps:'Footsteps',waves:'Waves',birds:'Birds',magic:'Magic',fire:'Fire',bell:'Bell',sword:'Sword',crowd:'Crowd',horse:'Horse',heartbeat:'Heartbeat',clock:'Clock tick',horn:'Ship horn'};
const SFX_ICON={rain:'cloud-rain',thunder:'cloud-lightning',wind:'wind',door:'door-open',knock:'hand-fist',steps:'footprints',waves:'waves',birds:'bird',magic:'sparkle',fire:'fire',bell:'bell',sword:'sword',crowd:'users-three',horse:'horse',heartbeat:'heartbeat',clock:'clock',horn:'megaphone'};
const COLORS=['var(--nar)','var(--acc)','var(--mus)','var(--sfx)','#B9A6FF','#7FB2FF','#FF9EC4','#9BE37A'];
const STEPS=[['story','Story'],['analysis','Analysis'],['voices','Voices'],['build','Build'],['timeline','Timeline'],['player','Listen'],['export','Export']];

let S={view:'home',title:'',text:'',lang:'en',genreHint:'auto',tab:'paste',an:null,cast:{},sel:null,built:false,fmt:'mp3',selBlock:null,engine:null};
const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return localStorage}catch(e){return null}})();
function save(){if(!store)return;try{const {view,title,text,lang,genreHint,an,cast,sel,fmt}=S;store.setItem('vv-state',JSON.stringify({view,title,text,lang,genreHint,an,cast,sel,fmt}))}catch(e){}}
function load(){try{const j=JSON.parse(store?.getItem('vv-state')||'null');if(j)Object.assign(S,j)}catch(e){}S.view='home'} // always open on the home page; a saved story can be resumed from there
const KEYS={get(k){try{return sessionStorage.getItem(k)||store?.getItem(k)||''}catch(e){return ''}},
  set(k,v,remember){try{sessionStorage.setItem(k,v);if(remember&&v)store?.setItem(k,v);else store?.removeItem(k)}catch(e){}}};
const cfg=()=>({gem:KEYS.get('vv-gem'),gemModel:KEYS.get('vv-gem-model')||'gemini-2.5-flash',el:KEYS.get('vv-el'),elModel:KEYS.get('vv-el-model')||'eleven_multilingual_v2'});
const useEleven=()=>!!cfg().el, useGemini=()=>!!cfg().gem;

/* =========================================================
   BUILT-IN STORY READER
   ========================================================= */
const VERBS='said|says|asked|told|whispered|shouted|called|cried|replied|answered|muttered|murmured|sang|yelled|hissed|laughed|added|warned|snapped|sighed|begged|growled|breathed|announced|declared|exclaimed|insisted|explained|demanded|screamed|roared|giggled|grumbled|admitted|promised|wondered';
const STOP=new Set('The A An And But Then By At In On Of For From To It Its He She They We I You His Her Their Our My Your This That These Those When While After Before Far Below Above Inside Outside Somewhere Every Each All No Not Yes One Two Three Far Little Old Young There Here Who What Why How Where Mr Mrs Ms Dr Sir Lady Lord So Now Once Later Soon Suddenly Still Even Just Only As If Or Nor Yet With Without Through Across Over Under Into Onto Upon Around Behind Beside Between Beyond During Until Toward Towards Along Against Among'.split(' '));
const SFX_WORDS={rain:['rain','raindrops','drizzle','downpour','rained','raining'],thunder:['thunder','lightning'],wind:['wind','gust','breeze','gale','winds'],door:['door','gate','doors'],knock:['knock','knocked','knocking'],steps:['footsteps','footstep','stairs','stair','steps','walked','ran','climbed','crept','marched'],waves:['waves','wave','sea','ocean','shore','tide','surf'],birds:['birds','bird','gulls','gull','sparrow','crows','owl'],magic:['magic','spell','glowed','glow','glowing','shimmer','sparkle','enchanted','wand','spark'],fire:['fire','flame','flames','campfire','torch','hearth','fire-eaters','candle'],bell:['bell','bells','chime','rang','ringing'],sword:['sword','blade','clash','swords','steel'],crowd:['crowd','market','cheering','people','crowds'],horse:['horse','hooves','gallop','galloped','horses'],heartbeat:['heartbeat','pounding'],clock:['clock','tick','ticked','ticking'],horn:['horn']};
const SFX_DUR={rain:9,thunder:4.5,wind:8,door:1.6,knock:1.2,steps:3.2,waves:9,birds:6,magic:2.6,fire:7,bell:3.5,sword:1.4,crowd:6,horse:4,heartbeat:5,clock:4,horn:4};
const MOOD_WORDS={tense:['storm','dark','scream','fear','afraid','danger','chase','shadow','blood','trembl','panic','crash','monster','attack','shook','angry','lightning','thunder','hammer','locked','crept'],mysterious:['strange','whisper','voice','magic','fog','mist','secret','hidden','ancient','sing','sang','glow','spirit','ghost','moon','silver','exist'],hopeful:['dawn','morning','sun','smil','hope','safe','warm','bright','calm','answered','grew','remember'],sad:['tears','cry','wept','alone','lost','grief','goodbye','died','sorrow','lonely'],happy:['laugh','joy','danc','celebrat','happy','cheer','grin','delight'],epic:['battle','army','king','dragon','war','charge','sword','roar','hero','legend']};
const GENRES={Fantasy:['magic','dragon','spell','spirit','kingdom','wizard','witch','fairy','enchant','clockwork','clockmaker','glowed','made of brass'],'Sci-fi':['spaceship','planet','robot','space','laser','galaxy','android'],Mystery:['detective','clue','murder','suspect','missing'],Horror:['ghost','corpse','haunt','scream','blood'],Adventure:['map','treasure','journey','island','quest','pirate'],'Fairy tale':['once upon','princess','prince','castle']};
function countHits(text,list){const t=text.toLowerCase();return list.reduce((n,w)=>n+(t.split(w).length-1),0)}
function guessMood(text){let best='calm',bs=1;for(const m in MOOD_WORDS){const s=countHits(text,MOOD_WORDS[m]);if(s>bs){bs=s;best=m}}return best}
function guessGenre(text){let best='Drama',bs=0;for(const g in GENRES){const s=countHits(text,GENRES[g]);if(s>bs){bs=s;best=g}}return best}
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);

function localAnalyse(text,title){
  const paras=text.replace(/\r/g,'').split(/\n\s*\n|\n(?=\s*["“])/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
  const qre=/“([^”]+)”|"([^"]+)"/g, vre=new RegExp(`^(?:${VERBS})$`,'i');
  // pass 1: segments + explicit speakers
  const segs=[]; // {pi, kind:'q'|'n', text, speaker, pron}
  paras.forEach((p,pi)=>{
    let last=0,m;qre.lastIndex=0;
    while((m=qre.exec(p))){
      if(m.index>last)segs.push({pi,kind:'n',text:p.slice(last,m.index).trim(),pos:last});
      segs.push({pi,kind:'q',text:(m[1]||m[2]).trim(),after:p.slice(qre.lastIndex,qre.lastIndex+90),before:p.slice(Math.max(0,m.index-110),m.index),pos:m.index});
      last=qre.lastIndex;
    }
    if(last<p.length)segs.push({pi,kind:'n',text:p.slice(last).trim(),pos:last});
  });
  const V=`(?:${VERBS})`;
  const named=new Map(); // name -> count
  const norm=n=>{n=n.replace(/'s$/,'').trim();return n.split(' ').map(cap1).join(' ')};
  segs.forEach(s=>{
    if(s.kind!=='q')return;
    const a=s.after,b=s.before;let r;
    if((r=a.match(new RegExp(`^\\s*[,.!?]?\\s*(?:(?:old|young|little|poor|the)\\s+)?([A-Z][a-z]+(?:\\s[A-Z][a-z]+)?)\\s+(?:had\\s+|has\\s+)?${V}\\b`)))) s.speaker=norm(r[1]);
    else if((r=a.match(new RegExp(`^\\s*[,.!?]?\\s*${V}\\s+(?:old\\s+|young\\s+|little\\s+)?(?:the\\s+)?([A-Z][a-z]+(?:\\s[A-Z][a-z]+)?)\\b`)))) s.speaker=norm(r[1]);
    else if((r=a.match(new RegExp(`^\\s*[,.!?]?\\s*${V}\\s+the\\s+([a-z]+)\\b`)))) s.speaker=norm(r[1]);
    else if((r=a.match(new RegExp(`^\\s*[,.!?]?\\s*the\\s+([a-z]+)\\s+${V}\\b`)))) s.speaker=norm(r[1]);
    else if((r=a.match(new RegExp(`^\\s*[,.!?]?\\s*(he|she|they|i|it)\\s+${V}\\b`,'i')))) s.pron=r[1].toLowerCase();
    else if((r=b.match(new RegExp(`([A-Z][a-z]+(?:\\s[A-Z][a-z]+)?)\\s+${V}[,:.]?\\s*$`)))) s.speaker=norm(r[1]);
    else if((r=b.match(new RegExp(`\\b(?:the|a|an)\\s+([a-z]+)\\b[^.!?"“”]{0,32}\\b${V}[,:.]?\\s*$`)))) s.speaker=norm(r[1]);
    if(s.speaker&&STOP.has(s.speaker.split(' ')[0]))s.speaker=null;
    if(s.speaker)named.set(s.speaker,(named.get(s.speaker)||0)+1);
  });
  // gender + age per named speaker
  const lower=text.toLowerCase(), info={};
  for(const n of named.keys()){
    const nl=n.toLowerCase();let he=0,she=0,idx=-1;
    while((idx=lower.indexOf(nl,idx+1))>-1){const w=lower.slice(idx,idx+120).replace(/[“"][^”"]*[”"]/g,'');he+=(w.match(/\b(he|his|him|himself)\b/g)||[]).length;she+=(w.match(/\b(she|hers|herself)\b/g)||[]).length+(w.match(/\bher\b/g)||[]).length*.5}
    const age=new RegExp(`\\b(old|elderly|aged)\\s+${n}`,'i').test(text)?'elder':new RegExp(`\\b(little|young|small)\\s+${n}|\\b${n}\\b[^.]{0,40}\\b(girl|boy|child|kid)\\b`,'i').test(text)?'young':'adult';
    const eerie=/spirit|ghost|voice|bell|wind|shadow|witch|demon|dragon|monster/i.test(n);
    info[n]={gender:she>=he+1?'female':he>=she+1?'male':'unknown',age:eerie?'ageless':age,eerie};
  }
  // pass 2: resolve remaining quotes
  let lastSpeakerInPara={},lastNamedBefore=(pi,pos)=>{
    const ctx=(paras.slice(Math.max(0,pi-2),pi).join(' ')+' '+paras[pi].slice(0,pos)).replace(/“[^”]*”|"[^"]*"/g,' ');
    let best=null,bi=-1;for(const n of named.keys()){const i=ctx.lastIndexOf(n.split(' ')[0]);if(i>bi){bi=i;best=n}}return best};
  segs.forEach(s=>{
    if(s.kind!=='q'){return}
    if(!s.speaker){
      if(s.pron){const g=s.pron==='she'?'female':s.pron==='he'?'male':null;
        const ctx=(paras.slice(Math.max(0,s.pi-2),s.pi).join(' ')+' '+paras[s.pi].slice(0,s.pos)).replace(/“[^”]*”|"[^"]*"/g,' ');
        let best=null,bi=-1;for(const n of named.keys()){if(g&&info[n].gender!==g&&info[n].gender!=='unknown')continue;const i=ctx.lastIndexOf(n.split(' ')[0]);if(i>bi){bi=i;best=n}}
        s.speaker=best||lastSpeakerInPara[s.pi];}
      else s.speaker=lastSpeakerInPara[s.pi]||lastNamedBefore(s.pi,s.pos);
    }
    if(!s.speaker){s.speaker='Stranger';if(!info.Stranger){info.Stranger={gender:'unknown',age:'adult',eerie:false};named.set('Stranger',0)}}
    lastSpeakerInPara[s.pi]=s.speaker;
  });
  // lines (drop tiny attribution-only narration)
  const tagRe=new RegExp(`^[,.\\s]*(?:[A-Za-z' ]{0,28})\\b${V}\\b[\\s,.!?]*(?:[a-z ]{0,20})?[.!?,]?\\s*$`,'i');

      const hit=sceneLines.find(o=>new RegExp(`\\b(${SFX_WORDS[type].join('|')})\\b`,'i').test(o.l.text));

  });

  [...named.keys()].sort((a,b)=>lines.filter(l=>l.speaker===b).length-lines.filter(l=>l.speaker===a).length).forEach((n,i)=>{

    body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:json?.3:.9,...(json?{responseMimeType:'application/json'}:{})}})});

async function geminiAnalyse(text,title){

   "sfx":[{"type":one of ${JSON.stringify(Object.keys(SFX_TYPES))},"line_index":index into this scene's lines where the sound should start}]}]}

${text}`;
  const j=await gemini(p,true);

  const list=voiceList();const used={};const cast={};

    const prev=S.cast[c.name];
    let want=c.gender==='female'?'female':c.gender==='male'?'male':null;
    let pool=list.filter(v=>!want||v.gender===want||v.gender==='unknown');if(!pool.length)pool=list;
    if(useEleven()&&c.name==='Narrator'){const n=pool.find(v=>/narrat|audiobook/i.test(v.use+v.desc));if(n)pool=[n,...pool]}
    if(useEleven()&&c.age==='elder'){const o=pool.filter(v=>/old|middle/i.test(v.age));if(o.length)pool=[...o,...pool]}

function speakBrowser(line,onend){
  if(!('speechSynthesis' in window)||!bVoices.length){const ms=estDur(line)*1000;const t=setTimeout(onend,ms);return()=>clearTimeout(t)}

  case 'thunder':{const a=N(380,'lowpass'),g=gain(ctx);a.connect(g);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1.2,t+.08);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(o);
    const b=N(1600,'lowpass'),g2=gain(ctx);b.connect(g2);hit(g2,t,.7,.5);g2.connect(o);const c=N(240,'lowpass'),g3=gain(ctx);c.connect(g3);g3.gain.setValueAtTime(0,t+1.1);g3.gain.linearRampToValueAtTime(.8,t+1.4);g3.gain.exponentialRampToValueAtTime(.001,t+d);g3.connect(o);break}
  case 'door':{const s=osc(ctx,'sawtooth',190,t,t+.9);s.frequency.linearRampToValueAtTime(110,t+.8);const bp=filt(ctx,'bandpass',900,6),g=gain(ctx);env(g,t,.06,.35,.6,.15);s.connect(bp);bp.connect(g);g.connect(o);
    const th=osc(ctx,'sine',95,t+.85,t+1.4);th.frequency.exponentialRampToValueAtTime(42,t+1.1);const g2=gain(ctx);hit(g2,t+.85,1,.4);th.connect(g2);g2.connect(o);break}
  case 'knock':{[0,.22,.44].forEach(x=>{const s=osc(ctx,'sine',170,t+x,t+x+.2);s.frequency.exponentialRampToValueAtTime(80,t+x+.12);const g=gain(ctx);hit(g,t+x,.9,.15);s.connect(g);g.connect(o)});break}
  case 'steps':{for(let x=0;x<d-.2;x+=.48){const n=noise(ctx,t+x,t+x+.12),bp=filt(ctx,'bandpass',700+Math.random()*300,1.4),g=gain(ctx);hit(g,t+x,.55,.1);n.connect(bp);bp.connect(g);g.connect(o)}break}
  case 'waves':{const a=N(800,'lowpass'),g=gain(ctx,0),sw=gain(ctx,0);a.connect(sw);sw.connect(g);const l=osc(ctx,'sine',.16,t,E),lg=gain(ctx,.22);l.connect(lg);lg.connect(sw.gain);sw.gain.setValueAtTime(.25,t);env(g,t,1.5,1,d-3,1.5);g.connect(o);break}
  case 'birds':{for(let k=0;k<d*1.6;k++){const tt=t+Math.random()*(d-.5);for(let c=0;c<2+Math.floor(Math.random()*3);c++){const s=osc(ctx,'sine',2600+Math.random()*900,tt+c*.11,tt+c*.11+.09);s.frequency.exponentialRampToValueAtTime(4200,tt+c*.11+.06);const g=gain(ctx);hit(g,tt+c*.11,.1,.08);s.connect(g);g.connect(o)}}break}
  case 'magic':{const sc=[1046,1175,1397,1568,1760,2093,2349];for(let k=0;k<12;k++){const tt=t+k*.13;const s=osc(ctx,k%2?'triangle':'sine',sc[(k*3)%sc.length],tt,tt+1.1),g=gain(ctx);hit(g,tt,.16,1);s.connect(g);g.connect(o)}const a=N(7000,'highpass'),g=gain(ctx);a.connect(g);env(g,t,.8,.06,d-1.6,.8);g.connect(o);break}
  case 'fire':{const a=N(900,'lowpass'),g=gain(ctx);a.connect(g);env(g,t,1,.22,d-2,1);g.connect(o);for(let k=0;k<d*9;k++){const tt=t+Math.random()*d,n=noise(ctx,tt,tt+.03),bp=filt(ctx,'bandpass',2500+Math.random()*2500,2),gg=gain(ctx);hit(gg,tt,.35*Math.random(),.025);n.connect(bp);bp.connect(gg);gg.connect(o)}break}
  case 'bell':{[0,1.4].forEach(x=>[[1,.4],[2.76,.18],[5.4,.09],[8.93,.05]].forEach(([m,a])=>{const s=osc(ctx,'sine',520*m,t+x,t+x+2.6),g=gain(ctx);hit(g,t+x,a,2.4);s.connect(g);g.connect(o)}));break}
  case 'sword':{[1830,2610,3720,5190].forEach(f=>{const s=osc(ctx,'sine',f,t,t+1),g=gain(ctx);hit(g,t,.12,.9);s.connect(g);g.connect(o)});const a=N(3000,'highpass'),g=gain(ctx);a.connect(g);hit(g,t,.5,.12);g.connect(o);break}
  case 'crowd':{[600,1100,1700].forEach((f,i)=>{const n=noise(ctx,t,E+.1),bp=filt(ctx,'bandpass',f,.9),g=gain(ctx),l=osc(ctx,'sine',.3+i*.21,t,E),lg=gain(ctx,180);l.connect(lg);lg.connect(bp.frequency);n.connect(bp);bp.connect(g);env(g,t,1.4,.22,d-2.8,1.4);g.connect(o)});break}
  case 'horse':{for(let x=0;x<d-.3;x+=.55)[0,.09,.2].forEach(y=>{const s=osc(ctx,'sine',130,t+x+y,t+x+y+.15);s.frequency.exponentialRampToValueAtTime(60,t+x+y+.1);const g=gain(ctx);hit(g,t+x+y,.6,.1);s.connect(g);g.connect(o)});break}
  case 'heartbeat':{for(let x=0;x<d-.3;x+=.9)[0,.24].forEach((y,j)=>{const s=osc(ctx,'sine',62,t+x+y,t+x+y+.22);s.frequency.exponentialRampToValueAtTime(38,t+x+y+.15);const g=gain(ctx);hit(g,t+x+y,j?.6:.9,.18);s.connect(g);g.connect(o)});break}
  case 'clock':{for(let x=0;x<d;x+=.5){const s=osc(ctx,'square',x%1?2400:2000,t+x,t+x+.03),hp=filt(ctx,'highpass',1500),g=gain(ctx);hit(g,t+x,.12,.025);s.connect(hp);hp.connect(g);g.connect(o)}break}
  case 'horn':{[110,165,220].forEach(f=>{const s=osc(ctx,'sawtooth',f,t,E),lp=filt(ctx,'lowpass',700),g=gain(ctx);env(g,t,.4,.12,d-1.4,1);s.connect(lp);lp.connect(g);g.connect(o)});break}
  }
  return o;
}

/* ---------- timeline layout ---------- */
const GAP=.38,SCENE_GAP=1.4;
function layout(){
  const an=S.an;if(!an)return;let t=.8;
  an.scenes.forEach((sc,si)=>{sc.start=t;an.lines.forEach((l,li)=>{if(l.scene!==si)return;const b=bufs[li];l.start=t;l.dur=b?b.duration:estDur(l);t+=l.dur+GAP});sc.end=Math.max(t,sc.start+2);t=sc.end+SCENE_GAP});
  an.total=t+.8;
  an.scenes.forEach(sc=>{const per={};sc.sfx.forEach(x=>{const l=an.lines[x.line];const k=per[x.line]=(per[x.line]||0)+1;x.t=(l?l.start:sc.start)+.1+(k-1)*1.6;x.dur=SFX_DUR[x.type]||3})});
}
let bufs={}; // line index -> AudioBuffer (ElevenLabs)
let mix=null, mixDirty=true;

async function renderMix(withVoices=true){
  const an=S.an;layout();const sr=44100;const len=Math.ceil((an.total+2)*sr);
  const ctx=new OfflineAudioContext(2,len,sr);
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
  const mus=gain(ctx,.9),sfx=gain(ctx,.8),vox=gain(ctx,1);mus.connect(comp);sfx.connect(comp);vox.connect(comp);
  an.scenes.forEach(sc=>scheduleMusic(ctx,mus,sc.mood,Math.max(0,sc.start-.6),sc.end+SCENE_GAP*.8,sc.musVol??1));
  an.scenes.forEach(sc=>sc.sfx.forEach(x=>scheduleSfx(ctx,sfx,x.type,x.t,x.vol)));
  if(withVoices){an.lines.forEach((l,i)=>{const b=bufs[i];if(!b)return;const s=ctx.createBufferSource();s.buffer=b;s.connect(vox);s.start(l.start);
    mus.gain.setTargetAtTime(.45,l.start-.05,.08);mus.gain.setTargetAtTime(.9,l.start+l.dur,.25)})}
  return await ctx.startRendering();
}
function peaks(buf,n){const d=buf.getChannelData(0),step=Math.floor(d.length/n),out=[];let mx=0;for(let i=0;i<n;i++){let m=0;for(let j=i*step;j<(i+1)*step;j+=16)m=Math.max(m,Math.abs(d[j]));out.push(m);mx=Math.max(mx,m)}return out.map(v=>clamp(v/(mx||1),.06,1))}
function fakePeaks(n){const an=S.an;layout();const out=[];let seed=7;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<n;i++){const t=i/n*an.total;const inLine=an.lines.some(l=>t>=l.start&&t<=l.start+l.dur);out.push(inLine?.35+r()*.65:.08+r()*.14)}return out}

/* =========================================================
   PLAYBACK ENGINE (shared by player + timeline preview)
   ========================================================= */
const P={playing:false,t:0,idx:0,token:0,src:null,startedAt:0,offset:0,master:null,bed:null,bedScene:-1,cancel:null,lineAt:0,raf:0};
function engineMode(){return useEleven()&&mix?'mix':'live'}
function stopAll(){P.token++;if(P.cancel){P.cancel();P.cancel=null}if('speechSynthesis' in window)speechSynthesis.cancel();
  if(P.src){try{P.src.onended=null;P.src.stop()}catch(e){}P.src=null}
  if(P.master){const c=ac(),m=P.master;m.gain.setTargetAtTime(0,c.currentTime,.15);setTimeout(()=>m.disconnect(),900);P.master=null}P.bed=null;P.bedScene=-1}
function lineAtTime(t){const L=S.an.lines;let i=0;for(let k=0;k<L.length;k++)if(L[k].start<=t+.01)i=k;return i}
async function play(from){
  const an=S.an;if(!an)return;layout();if(from!=null)P.t=from;if(P.t>=an.total-.5)P.t=0;
  stopAll();P.playing=true;const ctx=ac();await ctx.resume();
  if(engineMode()==='mix'){
    if(mixDirty){toast('Updating the mix…');mix=await renderMix(true);mixDirty=false;}
    const s=ctx.createBufferSource();s.buffer=mix;s.connect(ctx.destination);s.start(0,P.t);P.src=s;P.startedAt=ctx.currentTime;P.offset=P.t;
    const tok=P.token;s.onended=()=>{if(tok===P.token){P.playing=false;P.t=0;refreshPlay()}};
  } else {
    P.master=gain(ctx,1);P.master.connect(ctx.destination);P.mus=gain(ctx,.9);P.mus.connect(P.master);P.sfxBus=gain(ctx,.8);P.sfxBus.connect(P.master);
    const i=lineAtTime(P.t);startLine(i,P.token);
  }
  tick();refreshPlay();
}
function startLine(i,tok){
  const an=S.an,ctx=ac();if(tok!==P.token)return;
  if(i>=an.lines.length){P.playing=false;P.t=0;stopAll();refreshPlay();return}
  const l=an.lines[i];P.idx=i;P.t=l.start;P.lineAt=ctx.currentTime;
  const sc=an.scenes[l.scene];
  if(P.bedScene!==l.scene){if(P.bed){const b=P.bed;b.gain.cancelScheduledValues(ctx.currentTime);b.gain.setTargetAtTime(0,ctx.currentTime,.5)}
    P.bed=scheduleMusic(ctx,P.mus,sc.mood,ctx.currentTime,ctx.currentTime+(sc.end-l.start)*1.8+6,sc.musVol??1);P.bedScene=l.scene}
  sc.sfx.forEach(x=>{if(x.line===i)scheduleSfx(ctx,P.sfxBus,x.type,ctx.currentTime+Math.max(.1,(x.t??l.start)-l.start),x.vol)});
  P.mus.gain.setTargetAtTime(.5,ctx.currentTime,.1);
  P.cancel=speakBrowser(l,()=>{if(tok!==P.token)return;P.mus.gain.setTargetAtTime(.9,ac().currentTime,.2);
    const nx=an.lines[i+1];const gap=nx&&nx.scene!==l.scene?SCENE_GAP:GAP;setTimeout(()=>startLine(i+1,tok),gap*1000)});
  refreshLine();
}
function pause(){if(!P.playing)return;P.t=curT();P.playing=false;stopAll();refreshPlay()}
function curT(){const an=S.an;if(!P.playing||!an)return P.t;const ctx=ac();
  if(engineMode()==='mix'&&P.src)return clamp(P.offset+ctx.currentTime-P.startedAt,0,an.total);
  const l=an.lines[P.idx];return l?clamp(l.start+(ctx.currentTime-P.lineAt),l.start,l.start+l.dur+GAP):P.t}
function seek(t){const was=P.playing;P.t=clamp(t,0,S.an.total-.1);if(was)play(P.t);else{stopAll();refreshPlay();refreshLine()}}
function tick(){cancelAnimationFrame(P.raf);const f=()=>{if(!P.playing)return;const t=curT();updateClock(t);P.raf=requestAnimationFrame(f)};P.raf=requestAnimationFrame(f)}
function updateClock(t){
  const an=S.an;if(!an)return;const pr=t/an.total;
  $$('.time b').forEach(b=>b.textContent=fmtT(t));
  const bw=$('#bigwave');if(bw){const bars=bw.children,k=Math.floor(pr*bars.length);if(bw._k!==k){bw._k=k;for(let i=0;i<bars.length;i++)bars[i].classList.toggle('p',i<k)}}
  const ph=$('#playhead');if(ph)ph.style.left=(pr*100)+'%';
  const li=lineAtTime(t);if(li!==P.shownLine){P.shownLine=li;P.idx=li;refreshLine()}
  $$('.ch').forEach((c,i)=>{const sc=an.scenes[i];const on=t>=sc.start-.2&&t<sc.end+SCENE_GAP;c.classList.toggle('on',on);const bar=c.querySelector('.bar i');if(bar)bar.style.width=on?clamp((t-sc.start)/(sc.end-sc.start)*100,0,100)+'%':'0'});
}
function refreshPlay(){$$('.pp i,.ppv i').forEach(i=>i.className='ph-fill '+(P.playing?'ph-pause':'ph-play'));$$('.pp,.ppv').forEach(b=>b.setAttribute('aria-label',P.playing?'Pause':'Play'));
  const oa=$('#onair');if(oa){oa.classList.toggle('live',P.playing);oa.lastChild.textContent=P.playing?'NOW PLAYING':'PAUSED'}updateClock(P.playing?curT():P.t)}
function refreshLine(){
  const an=S.an;if(!an)return;const i=P.idx;const L=an.lines;
  const ly=$('#lyric');if(ly){ly.innerHTML=[i-1,i,i+1].map(k=>L[k]?`<p class="${k===i?'cur':''}"><span class="spk">${esc(L[k].speaker)}</span>${esc(L[k].text)}</p>`:'<p></p>').join('')}
  const sp=L[i]?.speaker;$$('.castmini .av').forEach(a=>a.classList.toggle('speaking',P.playing&&a.dataset.n===sp));
  const ns=$('#nowScene');if(ns&&L[i]){const sc=an.scenes[L[i].scene];ns.textContent=`Scene ${L[i].scene+1} · ${sc.title}`}
  $$('.b.cur').forEach(b=>b.classList.remove('cur'));const bl=$(`.b[data-k="line"][data-i="${i}"]`);if(bl&&P.playing)bl.classList.add('cur');
}

function wordMsg(w){return w===0?'Start with 300–500 words':w<40?'A little more, please (40 words minimum)':w<300?'Short and sweet, about '+Math.max(1,Math.round(w/150))+' min':w<=500?'Good length for a '+Math.round(w/150)+'–'+Math.round(w/120)+' minute story':w<=800?'Longer than the demo limit; it will take longer':'Too long for now: keep it under 800 words'}

      const r=new FileReader();r.onload=()=>{S.text=String(r.result);if(!S.title)S.title=file.name.replace(/\.txt$/i,'').replace(/[-_]+/g,' ');S.tab='paste';save();render();toast('Story loaded')};r.readAsText(file)};
    f.onchange=()=>readF(f.files[0]);d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');readF(e.dataTransfer.files[0])}}

      const parts=t.replace(/\*\*/g,'').split(/\n\s*\n/);S.title=parts[0].replace(/^title:\s*/i,'').replace(/^#+\s*/,'').trim();S.text=parts.slice(1).join('\n\n').trim();S.tab='paste'}
    catch(e){lastErr=e.message}busy=false;save();render()};

/* ---- build ---- */
const BSTEPS=[['script','scroll','Writing the script'],['voices','microphone','Recording voices'],['music','music-notes','Scoring the music'],['sfx','waveform','Placing sound effects'],['mix','sliders-horizontal','Mixing it together']];
let B={running:false,step:0,prog:0,detail:{},fail:null};
function vBuild(){const pct=Math.round(B.prog*100);const C=2*Math.PI*200;
return `<div class="gen-wrap">
  <div class="ring"><svg viewBox="0 0 440 440" aria-hidden="true"><circle cx="220" cy="220" r="200" fill="none" stroke="#262B37" stroke-width="12"/><circle id="ringc" cx="220" cy="220" r="200" fill="none" stroke="${B.fail?'#FF7A7A':'#FF5A36'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-B.prog)}" transform="rotate(-90 220 220)"/></svg>
    <div class="c"><span class="disp" id="pct">${pct}%</span><span class="cap" id="eta" style="margin-top:12px">${B.fail?'Stopped':pct>=100?'Done':'Working…'}</span></div></div>
  <div><span class="cap">Building your audio story</span><h1 class="disp h1" id="bTitle" style="margin:12px 0 32px">${B.fail?'Something went wrong':pct>=100?'Ready to listen':BSTEPS[B.step][2]}</h1>
    <div id="plist">${BSTEPS.map(([k,ic,t],i)=>{const st=B.fail&&i===B.step?'fail':i<B.step||B.prog>=1?'done':i===B.step?'now':'wait';
      return `<div class="pstep ${st}"><span class="ic"><i class="ph ph-${st==='done'?'check':st==='fail'?'x':ic}"></i></span><div><b>${t}</b><small>${esc(B.detail[k]||'')}</small></div><span class="st">${st==='done'?'Done':st==='fail'?'Failed':st==='now'?'Working':'—'}</span></div>`}).join('')}</div>
    ${B.fail?`<div class="err" style="margin-top:20px"><i class="ph ph-warning-circle"></i><span>${esc(B.fail)}</span></div><div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap"><button class="btn btn-p" id="retry"><i class="ph ph-arrow-clockwise"></i>Retry this step</button>${useEleven()?'<button class="btn btn-s" id="useBrowser">Use browser voices instead</button>':''}<button class="btn btn-g" id="backV">Back to voices</button></div>`:
     `<p class="hint" style="margin-top:24px"><i class="ph ph-info"></i> Keep this tab open. ${useEleven()?'Each line is recorded by ElevenLabs.':'Demo mode uses this browser\'s voices; they play live instead of being recorded.'}</p>`}
  </div></div>`}
bind.build=()=>{if(!B.running&&!B.fail&&B.prog<1)runBuild();if(!B.running&&B.prog>=1&&!B.fail)runBuild();
  const r=$('#retry');if(r)r.onclick=()=>{B.fail=null;runBuild(B.step)};const ub=$('#useBrowser');if(ub)ub.onclick=()=>{KEYS.set('vv-el','',false);elVoices=null;autoCast(S.an);B.fail=null;render();runBuild(0)};
  const bv=$('#backV');if(bv)bv.onclick=()=>{B.fail=null;go('voices')}};
function upd(){if(S.view!=='build')return;const C=2*Math.PI*200;const c=$('#ringc');if(c)c.setAttribute('stroke-dashoffset',C*(1-B.prog));const p=$('#pct');if(p)p.textContent=Math.round(B.prog*100)+'%';
  $$('#plist .pstep').forEach((el,i)=>{const st=i<B.step?'done':i===B.step?'now':'wait';el.className='pstep '+st;el.querySelector('.ic i').className='ph ph-'+(st==='done'?'check':BSTEPS[i][1]);el.querySelector('small').textContent=B.detail[BSTEPS[i][0]]||'';el.querySelector('.st').textContent=st==='done'?'Done':st==='now'?'Working':'—'});
  const t=$('#bTitle');if(t)t.textContent=BSTEPS[B.step][2]}
async function runBuild(from=0){
  if(B.running)return;B.running=true;B.fail=null;const an=S.an;const W=[.08,.62,.1,.08,.12];const base=i=>W.slice(0,i).reduce((a,b)=>a+b,0);
  B.step=from;B.prog=base(from);if(S.view==='build')render();
  try{
    for(let i=from;i<5;i++){B.step=i;const k=BSTEPS[i][0];B.prog=base(i);upd();
      if(k==='script'){B.detail.script=`${an.lines.length} lines, each tagged to a speaker`;await sleep(500)}
      if(k==='voices'){
        if(useEleven()){const todo=an.lines.map((l,j)=>j).filter(j=>!bufs[j]);let done=an.lines.length-todo.length;const ctx=ac();
          const worker=async()=>{while(todo.length){const j=todo.shift();const l=an.lines[j];B.detail.voices=`${l.speaker} · line ${done+1} of ${an.lines.length}`;upd();
            const ab=await ttsEleven(l);bufs[j]=await ctx.decodeAudioData(ab);done++;B.prog=base(i)+W[i]*done/an.lines.length;upd()}};
          await Promise.all([worker(),worker(),worker()]);B.detail.voices=`${an.lines.length} lines recorded`;}
        else{for(let j=0;j<an.lines.length;j++){B.detail.voices=`${an.lines[j].speaker} · line ${j+1} of ${an.lines.length}`;B.prog=base(i)+W[i]*(j+1)/an.lines.length;upd();await sleep(Math.min(60,1800/an.lines.length))}
          B.detail.voices=`${an.chars.length} voices ready (they play live)`}
      }
      if(k==='music'){layout();B.detail.music=an.scenes.map(s=>cap1(s.mood)).join(' → ');await sleep(450)}
      if(k==='sfx'){const n=an.scenes.reduce((a,s)=>a+s.sfx.length,0);B.detail.sfx=`${n} cue${n===1?'':'s'} across ${an.scenes.length} scenes`;await sleep(450)}
      if(k==='mix'){layout();if(useEleven()){B.detail.mix='Voices on top, music underneath';upd();mix=await renderMix(true);mixDirty=false}else{B.detail.mix=`${fmtT(an.total)} long`;await sleep(400)}}
    }
    B.prog=1;B.step=4;S.built=true;B.running=false;save();if(S.view==='build'){render();await sleep(900);if(S.view==='build')go('timeline')}
  }catch(e){B.running=false;B.fail=e.message||String(e);if(S.view==='build')render()}
}

/* ---- timeline ---- */
function vTimeline(){
  const an=S.an;layout();const T=an.total;const minW=Math.max(100,T*18);const pc=x=>x/T*100;
  const blk=(cls,k,i,a,d,label,extra='')=>`<button class="b ${cls} ${S.selBlock&&S.selBlock.k===k&&S.selBlock.i==i?'sel':''}" data-k="${k}" data-i="${i}" style="left:${pc(a)}%;width:calc(${pc(d)}% - 3px)" title="${esc(label)}"><span>${esc(label)}</span>${extra}</button>`;
  const wv=(n,s)=>{let h='',x=s*7+3;for(let i=0;i<n;i++){x=(x*9301+49297)%233280;h+=`<i style="height:${Math.round((.25+x/233280*.75)*100)}%"></i>`}return `<span class="wv">${h}</span>`};

function toWav(buf){const ch=buf.numberOfChannels,sr=buf.sampleRate,n=buf.length,out=new DataView(new ArrayBuffer(44+n*ch*2));const w=(o,s)=>[...s].forEach((c,i)=>out.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');out.setUint32(4,36+n*ch*2,true);w(8,'WAVE');w(12,'fmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,ch,true);out.setUint32(24,sr,true);out.setUint32(28,sr*ch*2,true);out.setUint16(32,ch*2,true);out.setUint16(34,16,true);w(36,'data');out.setUint32(40,n*ch*2,true);

async function toMp3(buf){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js');
  const enc=new lamejs.Mp3Encoder(2,buf.sampleRate,128);const L=buf.getChannelData(0),R=buf.getChannelData(1);const toI=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const v=clamp(a[i],-1,1);o[i]=v<0?v*0x8000:v*0x7FFF}return o};

  $('#kSave').onclick=async()=>{const rem=$('#kRem').checked;const el=$('#kEl').value.trim(),oldEl=cfg().el;
    KEYS.set('vv-gem',$('#kGem').value.trim(),rem);KEYS.set('vv-gem-model',$('#kGemM').value.trim()||'gemini-2.5-flash',rem);KEYS.set('vv-el',el,rem);KEYS.set('vv-el-model',$('#kElM').value.trim()||'eleven_multilingual_v2',rem);
    if(el&&el!==oldEl){elVoices=null;$('#kSave').innerHTML='<i class="ph ph-circle-notch spin"></i>Checking…';try{await loadElevenVoices();toast(`ElevenLabs connected: ${elVoices.length} voices`)}catch(e){$('#kErr').innerHTML=`<div class="err" style="margin-top:12px"><i class="ph ph-warning-circle"></i><span>${esc(e.message)}</span></div>`;$('#kSave').textContent='Save';return}}
    if(S.an&&el!==oldEl){autoCast(S.an);bufs={};mix=null;S.built=false;save()}
    close();render();};
}

/* ---------- global wiring ---------- */
$('#logo').onclick=()=>go('home');$('#logo').onkeydown=e=>{if(e.key==='Enter')go('home')};
$('#steps').onclick=e=>{const b=e.target.closest('[data-step]');if(b&&!b.disabled)go(b.dataset.step)};
$('#modeBtn').onclick=openSettings;
addEventListener('keydown',e=>{if(e.key==='Escape')$('#settings').classList.add('hidden');if(e.code==='Space'&&['player','timeline'].includes(S.view)&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();P.playing?pause():play()}});
load();
if(S.an&&S.view!=='home'&&!S.cast[S.an.chars[0].name])autoCast(S.an);
if(useEleven())loadElevenVoices().then(()=>{if(S.an)autoCast(S.an);if(S.view==='voices')render()}).catch(()=>{});
render();
</script>
</body>
</html>
